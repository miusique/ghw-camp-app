<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F7A4B">
<title>GHW Prüfung 2026</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:15px;background:#F0EDE6;color:#1A1916}
@supports(-webkit-touch-callout:none){html,body{height:-webkit-fill-available}}
#app{height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:#fff;box-shadow:0 0 40px rgba(0,0,0,.12)}
@supports(-webkit-touch-callout:none){#app{height:-webkit-fill-available}}
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}
.topbar{background:#1F7A4B;color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:max(14px,env(safe-area-inset-top))}
.topbar-title{font-size:16px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-btn{font-size:26px;color:rgba(255,255,255,.85);background:none;border:none;cursor:pointer;padding:0 4px 0 0;line-height:1}
.sync-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sync-dot.online{background:#7FD67F}
.sync-dot.offline{background:#FFB347}
.body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.grp-card{background:#F7F5EF;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.grp-card:active{border-color:#1F7A4B}
.grp-num{font-size:22px;font-weight:800;width:44px;text-align:center;flex-shrink:0}
.grp-info{flex:1;min-width:0}
.grp-name{font-size:15px;font-weight:600}
.grp-sub{font-size:12px;color:#777;margin-top:2px}
.grp-prog{font-size:13px;font-weight:600;flex-shrink:0;text-align:right}
.grp-prog.done{color:#1F7A4B}
.grp-prog.partial{color:#C9A227}
.grp-prog.none{color:#CCC}
.prog-bar{height:5px;background:#E4E1D9;border-radius:3px;margin-top:6px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .3s}
.kind-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#F7F5EF;border-radius:12px;cursor:pointer;transition:opacity .1s}
.kind-row:active{opacity:.7}
.kind-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.kind-info{flex:1;min-width:0}
.kind-name{font-size:14px;font-weight:500}
.kind-sub{font-size:11px;color:#999;margin-top:1px}
.kind-badges{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mini-badge{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.mini-badge.g{background:#FFF3CC;color:#7B4500;border:1.5px solid #C9A227}
.mini-badge.s{background:#F0F0EE;color:#444;border:1.5px solid #888}
.mini-badge.b{background:#FAEEDA;color:#7B4500;border:1.5px solid #CD7F32}
.mini-badge.empty{background:#F0EDE6;border:1.5px dashed #CCC}
.chevron{color:#BBB;font-size:18px;flex-shrink:0}
.all-done-tag{background:#E6F5EC;color:#1F7A4B;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.vorh-card{background:#FFF8E7;border:1.5px solid #F0D060;border-radius:12px;padding:12px 14px}
.vorh-title{font-size:12px;font-weight:600;color:#7B5800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.vorh-btns{display:flex;gap:8px}
.vorh-btn{flex:1;padding:9px 6px;border-radius:9px;border:2px solid;font-size:13px;font-weight:700;cursor:pointer;background:transparent;text-align:center;transition:all .1s}
.vorh-btn:active{transform:scale(.94)}
.vorh-btn.kein{border-color:#CCC;color:#888}
.vorh-btn.sel-kein{background:#F0EDE6;border-color:#999;color:#555}
.vorh-btn.vbr{border-color:#CD7F32;color:#7B4500}
.vorh-btn.sel-vbr{background:#FAEEDA;border-color:#CD7F32;color:#7B4500}
.vorh-btn.vsi{border-color:#888;color:#444}
.vorh-btn.sel-vsi{background:#F0F0EE;border-color:#555;color:#222}
.disz-row{background:#F7F5EF;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.disz-name{flex:1;font-size:14px;font-weight:500}
.level-btns{display:flex;gap:6px}
.lvl-btn{width:50px;height:36px;border-radius:9px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;transition:all .1s;background:transparent;text-align:center;line-height:1}
.lvl-btn:active{transform:scale(.94)}
.lvl-btn.br{border-color:#CD7F32;color:#7B4500}
.lvl-btn.si{border-color:#888;color:#444}
.lvl-btn.go{border-color:#C9A227;color:#5A3C00}
.lvl-btn.sel-br{background:#FAEEDA;border-color:#CD7F32;color:#7B4500}
.lvl-btn.sel-si{background:#F0F0EE;border-color:#555;color:#222}
.lvl-btn.sel-go{background:#FFF3CC;border-color:#C9A227;color:#4A3000}
.save-flash{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1F7A4B;color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.save-flash.show{opacity:1}
.section-label{font-size:13px;font-weight:600;color:#555;padding:4px 0 2px}
</style>
</head>
<body>
<div id="app">
  <div id="s-gruppen" class="screen active">
    <div class="topbar">
      <div class="topbar-title">&#9971; GHW Abzeichen-Prüfung 2026</div>
      <div id="sync1" class="sync-dot offline"></div>
    </div>
    <div class="body" id="grp-list"></div>
  </div>
  <div id="s-kinder" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="goTo('gruppen')">&#8249;</button>
      <div class="topbar-title" id="kinder-hdr"></div>
      <div id="sync2" class="sync-dot offline"></div>
    </div>
    <div class="body" id="kind-list"></div>
  </div>
  <div id="s-disz" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="goTo('kinder')">&#8249;</button>
      <div class="topbar-title" id="disz-hdr"></div>
      <div id="sync3" class="sync-dot offline"></div>
    </div>
    <div class="body" id="disz-body"></div>
  </div>
</div>
<div class="save-flash" id="flash">&#10003; Gespeichert</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const fb = initializeApp({apiKey:"AIzaSyBvsn0FfGn31aGyyRGcM0f2ZtZHTHEucVU",authDomain:"ghw-golfcamp.firebaseapp.com",projectId:"ghw-golfcamp",storageBucket:"ghw-golfcamp.firebasestorage.app",messagingSenderId:"745871614215",appId:"1:745871614215:web:a1ad765da30ef34656e5a2"});
const db = getFirestore(fb);
enableIndexedDbPersistence(db).catch(()=>{});
const RESULTS_DOC = doc(db,"camps","camp2026_2","data","pruefung2");
const GRUPPEN = [
  {id:"g1",label:"Gruppe 1",kinder:["Raphael Kux","Vincent Hussi","Henri Hille","Aaron Vogt"]},
  {id:"g2",label:"Gruppe 2",kinder:["Samir-Jan Weimer","Lukas Maximilian Dorß","Gabriel Dettenborn","Carl Block","Anna Ter-Nedden","Isabell Dettenborn"]},
  {id:"g3",label:"Gruppe 3",kinder:["Alice Hussi","Carlo Schulz","Theo Wöltjen","Nelson Baumgärtner","Lea Hille"]},
  {id:"g4",label:"Gruppe 4",kinder:["Josephine Greger","Alexander Neubersch","Maximilian Neubersch","Eva Ter-Nedden","Johann Kamerichs"]},
  {id:"g5",label:"Gruppe 5",kinder:["Lasse Weber","Hauke Weber","Malena Tenhumberg","Luisa Glockemann"]},
  {id:"g6",label:"Gruppe 6",kinder:["Adrian Woch","Paul Kutzner","Ferdinand Greger"]},
];
const GRP_COLORS=["#4CAF8A","#2196C4","#E07B39","#8B5EA4","#C9A227","#C2185B"];
const DISZ=[{key:"Pu",label:"Putten"},{key:"UD",label:"Up & Down"},{key:"An",label:"Annäherung"},{key:"Bu",label:"Bunker"},{key:"Ei",label:"Eisen"},{key:"Ho",label:"Holz"},{key:"Ko",label:"Koordination"},{key:"At",label:"Athletik"},{key:"Wi",label:"Wissen"}];
function kindId(g,i){return g+"_"+i;}
function initials(n){return n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();}
let results={},curGrp=null,curKind=null,screen="gruppen";
window.goTo=function(s,grpId,kindIdx){
  if(grpId!==undefined)curGrp=GRUPPEN.find(g=>g.id===grpId);
  if(kindIdx!==undefined)curKind={grp:curGrp,idx:kindIdx,name:curGrp.kinder[kindIdx],id:kindId(curGrp.id,kindIdx)};
  screen=s;
  document.querySelectorAll(".screen").forEach(el=>el.classList.remove("active"));
  document.getElementById("s-"+s).classList.add("active");
  if(s==="gruppen")renderGruppen();
  if(s==="kinder")renderKinder();
  if(s==="disz")renderDisz();
};
function renderGruppen(){
  document.getElementById("grp-list").innerHTML=GRUPPEN.map((grp,gi)=>{
    const total=grp.kinder.length*DISZ.length;
    const done=grp.kinder.reduce((sum,_,i)=>sum+DISZ.filter(d=>(results[kindId(grp.id,i)]||{})[d.key]).length,0);
    const kindDone=grp.kinder.filter((_,i)=>DISZ.every(d=>(results[kindId(grp.id,i)]||{})[d.key])).length;
    const pct=total?Math.round(done/total*100):0;
    const col=GRP_COLORS[gi];
    return '<div class="grp-card" onclick="goTo(\'kinder\',\''+grp.id+'\')">'
      +'<div class="grp-num" style="color:'+col+'">'+(gi+1)+'</div>'
      +'<div class="grp-info"><div class="grp-name">'+grp.label+'</div>'
      +'<div class="grp-sub">'+grp.kinder.length+' Kinder</div>'
      +'<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%;background:'+col+'"></div></div></div>'
      +'<div class="grp-prog '+(pct===100?'done':pct>0?'partial':'none')+'">'+kindDone+'/'+grp.kinder.length+'<br><span style="font-size:10px;font-weight:400;color:#AAA">fertig</span></div>'
      +'</div>';
  }).join("");
}
function renderKinder(){
  if(!curGrp)return;
  const gi=GRUPPEN.indexOf(curGrp);const col=GRP_COLORS[gi];
  document.getElementById("kinder-hdr").textContent=curGrp.label;
  document.getElementById("kind-list").innerHTML=curGrp.kinder.map((name,i)=>{
    const r=results[kindId(curGrp.id,i)]||{};
    const vorh=r._vorh||null;
    const allDone=DISZ.every(d=>r[d.key]);
    const doneCount=DISZ.filter(d=>r[d.key]).length;
    const badges=DISZ.map(d=>{const v=r[d.key];return '<span class="mini-badge '+(v==="g"?"g":v==="s"?"s":v==="b"?"b":"empty")+'">'+(v?v.toUpperCase():"")+"</span>";}).join("");
    const vorhLabel=vorh==="b"?"&#127951; Bronze":vorh==="s"?"&#127950; Silber":"";
    const sub=vorhLabel?"Vorhandenes Abzeichen: "+vorhLabel:doneCount>0?doneCount+"/9 eingetragen":"Noch keine Eingaben";
    return '<div class="kind-row" onclick="goTo(\'disz\',undefined,'+i+')">'
      +'<div class="kind-avatar" style="background:'+col+'">'+initials(name)+'</div>'
      +'<div class="kind-info"><div class="kind-name">'+name+'</div><div class="kind-sub">'+sub+'</div></div>'
      +(allDone?'<span class="all-done-tag">&#10003; Fertig</span>':'<div class="kind-badges">'+badges+'</div>')
      +'<span class="chevron">&#8250;</span></div>';
  }).join("");
}
function renderDisz(){
  if(!curKind)return;
  document.getElementById("disz-hdr").textContent=curKind.name;
  const r=results[curKind.id]||{};const vorh=r._vorh||null;
  const done=DISZ.filter(d=>r[d.key]).length;
  document.getElementById("disz-body").innerHTML=
    '<div class="vorh-card"><div class="vorh-title">&#11088; Vorhandenes Abzeichen</div><div class="vorh-btns">'
    +'<button class="vorh-btn kein '+((!vorh)?"sel-kein":"")+'" onclick="setVorh(null)">Keins</button>'
    +'<button class="vorh-btn vbr '+(vorh==="b"?"sel-vbr":"")+'" onclick="setVorh(\'b\')">&#127951; Bronze</button>'
    +'<button class="vorh-btn vsi '+(vorh==="s"?"sel-vsi":"")+'" onclick="setVorh(\'s\')">&#127950; Silber</button>'
    +'</div></div>'
    +'<div class="section-label">Prüfung · '+done+'/9 eingetragen</div>'
    +DISZ.map(d=>{const v=r[d.key]||"";
      return '<div class="disz-row"><div class="disz-name">'+d.label+'</div><div class="level-btns">'
        +'<button class="lvl-btn br '+(v==="b"?"sel-br":"")+'" onclick="setLevel(\''+d.key+'\',\'b\')">Br</button>'
        +'<button class="lvl-btn si '+(v==="s"?"sel-si":"")+'" onclick="setLevel(\''+d.key+'\',\'s\')">Si</button>'
        +'<button class="lvl-btn go '+(v==="g"?"sel-go":"")+'" onclick="setLevel(\''+d.key+'\',\'g\')">Go</button>'
        +'</div></div>';
    }).join("");
}
window.setVorh=function(level){
  const id=curKind.id;if(!results[id])results[id]={};
  if(level===null)delete results[id]._vorh;else results[id]._vorh=level;
  renderDisz();scheduleSave(id);
};
window.setLevel=function(key,level){
  const id=curKind.id;if(!results[id])results[id]={};
  results[id][key]=results[id][key]===level?null:level;
  if(!results[id][key])delete results[id][key];
  renderDisz();scheduleSave(id);
};
let saveTimers={};
function scheduleSave(id){
  clearTimeout(saveTimers[id]);
  saveTimers[id]=setTimeout(async()=>{
    try{await setDoc(RESULTS_DOC,{[id]:results[id]||{}},{merge:true});flashSave();}
    catch(e){console.warn(e);}
  },600);
}
function flashSave(){const el=document.getElementById("flash");el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1200);}
function setSyncStatus(on){document.querySelectorAll(".sync-dot").forEach(el=>{el.classList.toggle("online",on);el.classList.toggle("offline",!on);});}
onSnapshot(RESULTS_DOC,snap=>{setSyncStatus(true);if(snap.exists())Object.assign(results,snap.data());if(screen==="gruppen")renderGruppen();if(screen==="kinder")renderKinder();if(screen==="disz")renderDisz();},()=>setSyncStatus(false));
window.addEventListener("online",()=>setSyncStatus(true));
window.addEventListener("offline",()=>setSyncStatus(false));
renderGruppen();
</script>
</body>
</html>
