<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GHW Camp">
<meta name="theme-color" content="#185FA5">
<title>GHW Golfcamp 2026</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:15px;background:#F2F1EC;color:#1A1916}
@supports (-webkit-touch-callout: none){html,body{height:-webkit-fill-available}}
input,select,button,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
#app{height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:#fff;box-shadow:0 0 40px rgba(0,0,0,.15)}
@supports (-webkit-touch-callout: none){#app{height:-webkit-fill-available}}
.screen{display:none;flex-direction:column;height:100%;min-height:0}
.screen.active{display:flex}
.topbar{background:#fff;border-bottom:1px solid #E8E6DF;padding:14px 16px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:max(14px,env(safe-area-inset-top))}
.topbar-title{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-btn{font-size:22px;color:#888;padding:0 4px}
.body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.tab-bar{display:flex;border-top:1px solid #E8E6DF;background:#fff;flex-shrink:0;padding-bottom:max(0px,env(safe-area-inset-bottom));min-height:56px;position:relative;z-index:10}
.tab{flex:1;padding:10px 4px 8px;text-align:center;font-size:10.5px;color:#999;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab.active{color:#185FA5;font-weight:600}
.tab-icon{font-size:19px;line-height:1}
.card{background:#F7F6F0;border-radius:12px;padding:12px 14px}
.card-white{background:#fff;border:1px solid #E8E6DF;border-radius:12px;padding:12px 14px}
.lbl{font-size:12px;color:#888;margin-bottom:5px}
.divider{height:1px;background:#E8E6DF;margin:2px 0}
input[type=text],input[type=password],input[type=number],input[type=tel],select{width:100%;border:1.5px solid #D8D6CF;border-radius:9px;padding:10px 12px;font-size:15px;background:#fff;color:#1A1916;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:#185FA5}
.field{display:flex;flex-direction:column;gap:5px}
.btn{width:100%;padding:12px;border-radius:10px;font-size:15px;font-weight:600;text-align:center;transition:opacity .1s}
.btn:active{opacity:.75}
.btn-primary{background:#185FA5;color:#fff}
.btn-green{background:#1E5C0A;color:#fff}
.btn-gray{background:#F0EDE6;color:#444;font-weight:500}
.btn-sm{padding:8px 0;font-size:13px;font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#s-login{background:linear-gradient(160deg,#0D3D6B 0%,#185FA5 100%)}
.login-inner{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:18px}
.login-logo{text-align:center;color:#fff}
.login-logo h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
.login-logo p{font-size:13px;opacity:.7}
.login-card{background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:13px}
.login-card input,.login-card select{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);color:#fff}
.login-card input::placeholder{color:rgba(255,255,255,.6)}
.login-card .lbl{color:rgba(255,255,255,.8)}
.login-card select option{background:#185FA5;color:#fff}
.err-msg{color:#FFB3B3;font-size:13px;text-align:center;display:none}
.status-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 7px;border-radius:99px;font-weight:500;white-space:nowrap}
.status-online{background:#DFF0CC;color:#1E5C0A}
.status-offline{background:#FDECEA;color:#A32D2D}
.award-row{display:flex;gap:6px}
.award-btn{flex:1;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;border:2px solid;text-align:center;background:transparent}
.award-btn:active{opacity:.8}
.award-btn.br{border-color:#CD7F32;color:#7B4500}
.award-btn.si{border-color:#888;color:#444}
.award-btn.go{border-color:#C9A227;color:#5A3C00}
.award-btn.sel-br{background:#FAEEDA;border-color:#CD7F32;color:#7B4500}
.award-btn.sel-si{background:#F0F0EE;border-color:#555;color:#222}
.award-btn.sel-go{background:#FFF3CC;border-color:#C9A227;color:#4A3000}
.kind-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0EDE6}
.kind-row:last-child{border:none}
.kind-info{flex:1;min-width:0}
.kind-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind-meta{font-size:12px;color:#888;margin-top:1px}
.timer-display{font-size:50px;font-weight:300;letter-spacing:3px;font-variant-numeric:tabular-nums;text-align:center;padding:8px 0 4px;color:#1A1916}
.timer-display.urgent{color:#A32D2D}
.prog-bar{height:6px;background:#E8E6DF;border-radius:3px;overflow:hidden;margin:6px 0 12px}
.prog-fill{height:100%;border-radius:3px;transition:width 1s linear;background:#185FA5}
.prog-fill.urgent{background:#A32D2D}
.matrix-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.matrix{border-collapse:collapse;font-size:10.5px;white-space:nowrap}
table.matrix th{padding:4px 5px;text-align:center;color:#888;font-weight:500;border-bottom:1px solid #E8E6DF}
table.matrix th.nc{text-align:left;min-width:75px;padding-left:2px}
table.matrix td{padding:4px 5px;text-align:center;border-bottom:1px solid #F5F3ED}
table.matrix td.nc{text-align:left;font-size:12px}
table.matrix .grp-hdr td{background:#F7F6F0;font-size:10px;font-weight:600;color:#888;letter-spacing:.5px;text-transform:uppercase;padding:5px 5px 3px}
.dot{width:19px;height:19px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.dot-g{background:#FFF3CC;color:#7B4500;border:2px solid #C9A227}
.dot-s{background:#F0F0EE;color:#444;border:2px solid #888}
.dot-b{background:#FAEEDA;color:#7B4500;border:2px solid #CD7F32}
.dot-e{background:#F5F3ED;border:1.5px dashed #CCC}
.dot-abs{background:repeating-linear-gradient(45deg,#eee,#eee 3px,#ddd 3px,#ddd 6px);border:1.5px solid #CCC}
.anw-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F0EDE6}
.anw-row:last-child{border:none}
.anw-check{font-size:22px;cursor:pointer;user-select:none;flex-shrink:0}
.anw-info{flex:1}
.anw-name{font-size:14px;font-weight:500}
.anw-sub{font-size:12px;color:#888}
.q-text{font-size:14px;font-weight:500;line-height:1.5;margin-bottom:12px;color:#1A1916}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;border:2px solid #E8E6DF;margin-bottom:7px;cursor:pointer;font-size:13px;line-height:1.45;background:#fff;color:#1A1916}
.q-opt.sel{border-color:#185FA5;background:#EAF2FB;color:#0A2E52}
.q-opt.rev-ok{border-color:#1E5C0A;background:#DFF0CC;color:#0F3A06}
.q-opt.rev-wrong{border-color:#A32D2D;background:#FDECEA;color:#5A0A0A}
.q-opt.rev-missed{border-color:#1E5C0A;background:#F0F8E8;color:#0F3A06}
.q-cb{width:18px;height:18px;border-radius:4px;border:2px solid #CCC;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.q-cb.sel{background:#185FA5;border-color:#185FA5}
.q-cb.ok{background:#1E5C0A;border-color:#1E5C0A}
.q-cb.wrong{background:#A32D2D;border-color:#A32D2D}
.q-cb.missed{background:#1E5C0A;border-color:#1E5C0A}
.result-pass{background:#DFF0CC;color:#1E5C0A;border-radius:10px;padding:12px;text-align:center;font-size:15px;font-weight:600}
.result-fail{background:#FDECEA;color:#A32D2D;border-radius:10px;padding:12px;text-align:center;font-size:15px;font-weight:600}
.info-section{margin-bottom:12px}
.info-section .info-title{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.info-section .info-text{font-size:14px;line-height:1.55;color:#1A1916}
.bew-row{display:flex;gap:6px;margin-top:8px}
.bew-box{flex:1;border-radius:8px;padding:8px;text-align:center}
.bew-box .bew-level{font-size:10px;font-weight:700;margin-bottom:3px}
.bew-box .bew-val{font-size:12px;line-height:1.3}
.hint-box{background:#FFF8EE;border-left:3px solid #E8A000;border-radius:0 8px 8px 0;padding:9px 11px;font-size:13px;color:#7B4F00;line-height:1.45;margin-top:6px}
.next-box{background:#F0F7FF;border:1.5px solid #185FA5;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.next-arrow{font-size:20px;color:#185FA5}
.next-lbl{font-size:11px;color:#888}
.next-val{font-size:14px;font-weight:600;color:#0A2E52}
.plan-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #F0EDE6;font-size:13px}
.plan-row:last-child{border:none}
.plan-time{min-width:46px;color:#888;font-variant-numeric:tabular-nums;font-size:12px}
.plan-grp{flex:1}
.plan-now{background:#185FA5;color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600}
.plan-break{color:#AAA;font-style:italic}
.plan-play{color:#1E5C0A;font-weight:500}
#alert-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:20px}
#alert-overlay.show{display:flex}
.alert-box{background:#fff;border-radius:16px;padding:24px;max-width:320px;width:100%;text-align:center}
.alert-icon{font-size:40px;margin-bottom:8px}
.alert-title{font-size:18px;font-weight:700;margin-bottom:6px}
.alert-sub{font-size:14px;color:#666;margin-bottom:18px;line-height:1.45}
#sync-indicator{position:fixed;top:0;left:50%;transform:translateX(-50%);background:#1E5C0A;color:#fff;font-size:12px;padding:4px 14px;border-radius:0 0 8px 8px;z-index:50;display:none;font-weight:500}
#sync-indicator.show{display:block}
.helfer-card{background:#fff;border:1px solid #E8E6DF;border-radius:10px;padding:11px 13px;margin-bottom:8px}
.helfer-name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.helfer-name{font-size:14px;font-weight:600;flex:1}
.lizenz-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:#E1F5EE;color:#0F6E56}
.tel-link{font-size:13px;color:#185FA5;text-decoration:none;display:flex;align-items:center;gap:4px}
.station-assign-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F0EDE6}
.station-assign-row:last-child{border:none}
.station-lbl{flex:1;font-size:13px;font-weight:500}
.day-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.day-pill{flex-shrink:0;padding:7px 14px;border-radius:99px;background:#F0EDE6;color:#666;font-size:13px;font-weight:600;white-space:nowrap}
.day-pill.active{background:#185FA5;color:#fff}
.warmup-card{background:#FFF8EE;border:1.5px solid #E8A000;border-radius:12px;padding:14px}
</style>
</head>
<body>

<div id="sync-indicator">✓ Gespeichert</div>
<div id="alert-overlay">
  <div class="alert-box">
    <div class="alert-icon">⏱</div>
    <div class="alert-title">Gruppe wechseln!</div>
    <div class="alert-sub" id="alert-sub"></div>
    <button class="btn btn-primary" onclick="dismissAlert()">OK · Pause starten</button>
  </div>
</div>

<div id="app">

<!-- ══ LOGIN ══ -->
<div id="s-login" class="screen active">
  <div class="login-inner">
    <div class="login-logo">
      <h1>GHW Camp</h1>
      <p>Jugendgolfcamp · Juli 2026</p>
    </div>
    <div class="login-card">
      <div class="field">
        <div class="lbl">Anmelden als</div>
        <select id="login-rolle" onchange="toggleStationField()">
          <option value="trainer">Trainer</option>
          <option value="helfer">Helfer</option>
        </select>
      </div>
      <div class="field" id="block-field" style="display:none">
        <div class="lbl">Mein Stationsblock heute</div>
        <select id="login-block">
          <option value="0">Block 1 · Putten + Up &amp; Down</option>
          <option value="1">Block 2 · Eisen + Holz</option>
          <option value="2">Block 3 · Wissen</option>
          <option value="3">Block 4 · Bunker</option>
          <option value="4">Block 5 · Annäherung</option>
          <option value="5">Block 6 · Koordination + Athletik</option>
          <option value="dreiloch">3-Loch-Gruppe</option>
        </select>
      </div>
      <div class="field">
        <div class="lbl">Passwort</div>
        <input type="password" id="login-pw" placeholder="••••••" autocomplete="current-password">
      </div>
      <div class="err-msg" id="login-err">Falsches Passwort</div>
      <button class="btn btn-primary" style="background:rgba(255,255,255,.25);color:#fff;border:1.5px solid rgba(255,255,255,.4)" onclick="doLogin()">Einloggen →</button>
    </div>
    <div style="text-align:center;color:rgba(255,255,255,.4);font-size:12px" id="conn-status">Verbinde…</div>
  </div>
</div>

<!-- ══ TRAINER ══ -->
<div id="s-trainer" class="screen">
  <div class="topbar">
    <div class="topbar-title" id="trainer-title">Trainer-Übersicht</div>
    <span id="t-online-badge" class="status-badge">…</span>
    <button class="back-btn" onclick="doLogout()">↩</button>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="ttab-anw" onclick="trainerTab('anw')"><span class="tab-icon">✅</span>Anwesenheit</button>
    <button class="tab" id="ttab-matrix" onclick="trainerTab('matrix')"><span class="tab-icon">🏅</span>Abzeichen</button>
    <button class="tab" id="ttab-helfer" onclick="trainerTab('helfer')"><span class="tab-icon">👥</span>Helfer</button>
    <button class="tab" id="ttab-plan" onclick="trainerTab('plan')"><span class="tab-icon">📋</span>Heute</button>
  </div>
  <div id="t-anw" class="body"></div>
  <div id="t-matrix" class="body" style="display:none"></div>
  <div id="t-helfer" class="body" style="display:none"></div>
  <div id="t-plan" class="body" style="display:none"></div>
</div>

<!-- ══ HELFER ══ -->
<div id="s-helfer" class="screen">
  <div class="topbar">
    <div class="topbar-title" id="h-topbar-title">Timer</div>
    <span id="h-online-badge" class="status-badge">…</span>
    <button class="back-btn" onclick="doLogout()">↩</button>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="htab-timer" onclick="helferTab('timer')"><span class="tab-icon">⏱</span>Timer</button>
    <button class="tab" id="htab-erfassen" onclick="helferTab('erfassen')"><span class="tab-icon">✏️</span>Ergebnis</button>
    <button class="tab" id="htab-info" onclick="helferTab('info')"><span class="tab-icon">📋</span>Aufgabe</button>
  </div>
  <div id="h-timer" class="body">
    <div class="card" style="text-align:center;padding:16px">
      <div class="lbl">Aktuelle Gruppe</div>
      <div style="font-size:17px;font-weight:600;margin:4px 0 10px" id="h-cur-grp">—</div>
      <div class="timer-display" id="h-timer-disp">25:00</div>
      <div class="prog-bar"><div class="prog-fill" id="h-prog" style="width:100%"></div></div>
      <div class="row2">
        <button class="btn btn-primary btn-sm" id="h-btn-start" onclick="timerToggle()">▶ Start</button>
        <button class="btn btn-gray btn-sm" onclick="timerReset()">↺ Reset</button>
      </div>
    </div>
    <div class="next-box">
      <div class="next-arrow">→</div>
      <div><div class="next-lbl">Nächste Gruppe</div><div class="next-val" id="h-next-grp">—</div></div>
    </div>
    <div class="card" style="padding:10px 14px">
      <div class="lbl">Pause (5 Min)</div>
      <div style="font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;text-align:center;padding:4px 0 8px" id="h-umzug-disp">05:00</div>
      <div class="row2">
        <button class="btn btn-gray btn-sm" id="h-btn-umzug" onclick="umzugToggle()">▶ Start</button>
        <button class="btn btn-gray btn-sm" onclick="umzugReset()">↺ Reset</button>
      </div>
    </div>
    <button class="btn btn-gray btn-sm" onclick="helferTab('planh')">📋 Tagesplan ansehen</button>
  </div>
  <div id="h-erfassen" class="body" style="display:none"></div>
  <div id="h-info" class="body" style="display:none"></div>
  <div id="h-planh" class="body" style="display:none"></div>
</div>

</div><!-- #app -->

window.addEventListener('online',  ()=>{ isOnline=true;  updateOnlineBadge(); flushPending(); });
window.addEventListener('offline', ()=>{ isOnline=false; updateOnlineBadge(); });

function updateOnlineBadge() {
  document.querySelectorAll('#t-online-badge,#h-online-badge').forEach(b => {
    b.className = 'status-badge ' + (isOnline ? 'status-online' : 'status-offline');
    b.textContent = isOnline ? '● Online' : '○ Offline';
  });
}
async function flushPending() {
  while(pendingWrites.length > 0) {
    const {ref, data} = pendingWrites[0];
    try { await setDoc(ref, data, {merge:true}); pendingWrites.shift(); }
    catch(e) { break; }
  }
}
async function safeSetDoc(ref, data) {
  if(isOnline) { try { await setDoc(ref, data, {merge:true}); showSync(); } catch(e) { pendingWrites.push({ref,data}); } }
  else { pendingWrites.push({ref,data}); }
}
function showSync() {
  const el = document.getElementById('sync-indicator');
  el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 1400);
}

function buildMatrix() {

    html+=`<tr class="grp-hdr"><td colspan="${DISZ_KEYS.length+1}">${g.emoji} ${g.label}</td></tr>`;
    g.kinder.forEach((k,i) => {

window.assignHelfer = async function(blockId, name) {
  const key = curTag+'_block'+blockId;
  stationZuweisung[key] = name;
  await safeSetDoc(doc(db,'camps',CAMP_ID,'data','zuweisung'), {[key]: name});
};
window.toggleDreilochHelfer = async function(name, checked) {
  const key = curTag+'_dreiloch';
  let cur = (stationZuweisung[key]||'').split(',').filter(Boolean);
  if(checked && !cur.includes(name)) cur.push(name);
  if(!checked) cur = cur.filter(n=>n!==name);
  stationZuweisung[key] = cur.join(',');
  await safeSetDoc(doc(db,'camps',CAMP_ID,'data','zuweisung'), {[key]: cur.join(',')});
  buildStationZuweisung();
};

// ── TIMER mit Anwesenheitsfilter ──
function activeGroupOrder() {
  if(myBlock==='dreiloch') return DREILOCH_ORDER.map(id=>({id, ...DREILOCH_FLIGHTS[id], isDL:true}));
  return GRP_ORDER.map(id=>({id, ...GRUPPEN[id], isDL:false}));
}
function groupAtSlot(sl) {
  const order = activeGroupOrder();
  const blockNum = myBlock==='dreiloch' ? 0 : myBlock;
  const g = (blockNum - sl + order.length) % order.length;
  return order[g] || null;
}
function presentCountInGroup(grp) {
  if(!grp) return 0;
  let c=0;
  grp.kinder.forEach((_,i)=>{
    const key = grp.isDL ? (curTag+'_dl_'+grp.id+'_'+i) : anwKey(grp.id,i);
    if(anwesenheit[key]) c++;
  });
  return c;
}
function updateTimerDisplay() {
  const m=Math.floor(timerSec/60), s=timerSec%60;
  const d=document.getElementById('h-timer-disp'), f=document.getElementById('h-prog');
  if(!d) return;
  const urgent=timerSec>0&&timerSec<=180;
  d.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  d.className='timer-display'+(urgent?' urgent':'');
  f.style.width=Math.round(timerSec/1500*100)+'%'; f.className='prog-fill'+(urgent?' urgent':'');
  const cur=groupAtSlot(curSlot), nxt=groupAtSlot(curSlot+1);
  const cg=document.getElementById('h-cur-grp'), ng=document.getElementById('h-next-grp');
  if(cg) cg.textContent = cur ? `${cur.emoji} ${cur.label} (${presentCountInGroup(cur)} anwesend)` : '— Ende —';
  if(ng) ng.textContent = nxt ? `${nxt.emoji} ${nxt.label}` : '— Pause / Ende —';
}
window.timerToggle = function() {
  const btn=document.getElementById('h-btn-start');
  if(timerRunning){clearInterval(timerInt);timerRunning=false;btn.textContent='▶ Weiter';}
  else{timerInt=setInterval(timerTick,1000);timerRunning=true;btn.textContent='⏸ Pause';}
};
window.timerReset = function() {
  clearInterval(timerInt);timerRunning=false;timerSec=1500;
  document.getElementById('h-btn-start').textContent='▶ Start'; updateTimerDisplay();
};
function timerTick() {
  if(timerSec<=0){
    clearInterval(timerInt);timerRunning=false;
    document.getElementById('h-btn-start').textContent='▶ Start';
    const nxt=groupAtSlot(curSlot+1);
    document.getElementById('alert-sub').textContent=nxt?'Nächste Gruppe: '+nxt.emoji+' '+nxt.label:'Alle Gruppen durch.';
    document.getElementById('alert-overlay').classList.add('show');
    curSlot++; return;
  }
  timerSec--; updateTimerDisplay();
}
window.dismissAlert = function(){ document.getElementById('alert-overlay').classList.remove('show'); timerReset(); umzugReset(); };
window.umzugToggle = function() {
  const btn=document.getElementById('h-btn-umzug');
  if(umzugRunning){clearInterval(umzugInt);umzugRunning=false;btn.textContent='▶ Weiter';}
  else{umzugInt=setInterval(umzugTick,1000);umzugRunning=true;btn.textContent='⏸ Pause';}
};
window.umzugReset = function() {
  clearInterval(umzugInt);umzugRunning=false;umzugSec=300;
  document.getElementById('h-umzug-disp').textContent='05:00'; document.getElementById('h-btn-umzug').textContent='▶ Start';
};
function umzugTick() {
  if(umzugSec<=0){clearInterval(umzugInt);umzugRunning=false;document.getElementById('h-btn-umzug').textContent='▶ Start';return;}
  umzugSec--; const m=Math.floor(umzugSec/60),s=umzugSec%60;
  document.getElementById('h-umzug-disp').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

  const g=GRUPPEN[gId];
  const list=document.getElementById('h-kinder-list'); if(!list)return;
  list.innerHTML='';
  g.kinder.forEach((k,i)=>{
    const anwesend = isAnwesend(gId,i);
    if(!anwesend){
      const row=document.createElement('div'); row.className='kind-row'; row.style.opacity='0.4';
      row.innerHTML=`<div class="kind-info"><div class="kind-name">${k}</div><div class="kind-meta">Abwesend — Tag ${curTag}</div></div>`;
      list.appendChild(row); return;
    }
    const key=gId+'_'+i+'_'+dKey, cur=results[key]||null;
    const row=document.createElement('div'); row.className='kind-row';
    row.innerHTML=`<div class="kind-info"><div class="kind-name">${k}</div><div class="kind-meta">${DISZ_LABELS[dKey]}</div></div>
      <div class="award-row">

};

// ── WISSENS-QUIZ ──
const WISSEN={

    {f:"Was bedeuten rote oder gelbe Pfosten?",opts:["Sie helfen den Greenkeepern.","Sie kennzeichnen eine Penalty Area (z.B. Wasser).","Sie kennzeichnen einen Bunker."],correct:[1]},
    {f:"Was gibt es im Bunker zu beachten?",opts:["Ich harke den Bunker nachdem ich geschlagen habe und versuche alle Abdrücke zu beseitigen.","Ich harke nur meine eigenen Fußabdrücke."],correct:[0]},
    {f:"Worauf musst du achten, wenn du mit dem Training fertig bist?",opts:["Ich bringe meinen Ballkorb zurück zur Ballmaschine.","Auf dem Puttinggrün stecke ich die Fähnchen zurück.","Meinen Müll entsorge ich im Mülleimer.","Ich sammle meine Bälle auf der Driving Range ein.","Ich harke den Bunker, wenn ich ihn verlasse."],correct:[0,1,2,4]},
    {f:"Wenn du einen Probeschwung machst, musst du dich zuerst umsehen, ob deine Mitspieler weit genug entfernt stehen.",opts:["Richtig","Falsch"],correct:[0]},
  ],
  silber:[
    {f:"Was passiert, wenn du nach dem Schlag Rasenstücke herausgeschlagen hast?",opts:["Die Rasenstücke (Divots) muss ich zurücklegen und festtreten.","Ich bekomme einen Strafschlag."],correct:[0]},
    {f:"Dein Ball ist in einer Penalty Area (Wasser) gelandet. Wie gehst du vor?",opts:["Ich muss die Bahn von vorne spielen.","Ich darf den Ball droppen und mit einem Strafschlag weiterspielen.","Die Bahn ist für mich beendet."],correct:[1]},
    {f:"Was weißt du über Pitchmarken?",opts:["Pitchmarken sind kleine Dellen auf dem Grün.","Sie entstehen durch Regentropfen.","Bevor ich putte, bessere ich meine Pitchmarken aus.","Eine Pitchgabel sollte ich immer dabei haben."],correct:[0,2,3]},
    {f:"Wie reagierst du, wenn der Ball deines Mitspielers auf dem Grün im Weg liegt?",opts:["Ich muss drum herumspielen.","Ich lege ihn kurz zur Seite und wieder zurück.","Ich bitte meinen Mitspieler, seinen Ball zu markieren."],correct:[2]},
    {f:"Was musst du beachten, wenn du deinen Ball eingelocht hast?",opts:["Ich warte, bis alle eingelocht haben.","Ich achte darauf, nicht in die Puttlinie anderer zu treten.","Ich laufe allein weiter zum nächsten Abschlag.","Wir laufen direkt vom Grün, damit die nächste Gruppe spielen kann."],correct:[0,1,3]},
  ],
  gold:[
    {f:"Dein Ball ist im Bunker gelandet. Wie spielst du weiter?",opts:["Ich spiele den Ball wie er liegt — kein Berühren vor dem Schlag.","Ich muss ihn außerhalb droppen.","Ich mache Probeschwünge durch den Sand."],correct:[0]},
    {f:"In welchen Situationen rufst du laut 'Fore'?",opts:["Wenn mein Ball auf eine andere Bahn fliegt und dort jemand sein könnte.","Wenn ich putte und ein anderer Ball getroffen werden könnte.","Wenn mein Ball auf eine andere Spielergruppe zufliegt."],correct:[0,2]},
    {f:"Beim Putten trifft dein Ball versehentlich einen anderen Ball auf dem Grün. Was machst du?",opts:["Beide spielen von dort weiter, wo ihre Bälle liegen.","Der getroffene Ball wird zurückgelegt — ich erhalte 2 Strafschläge.","Ich erhalte keine Strafe."],correct:[1]},
    {f:"Beim Droppen muss ich immer einen Strafschlag hinzurechnen.",opts:["Richtig","Falsch"],correct:[1]},

function buildWissensQuiz(el) {
  quizState={level:"bronze",qIdx:0,selected:[],revealed:false,score:0};
  el.innerHTML=`<div class="row2">
    <div class="field"><div class="lbl">Stufe</div><select id="quiz-level" onchange="quizChangeLevel()"><option value="bronze">Bronze</option><option value="silber">Silber</option><option value="gold">Gold</option></select></div>
    <div class="field"><div class="lbl">Gruppe</div><select id="quiz-grp">${GRP_ORDER.map(g=>`<option value="${g}">${GRUPPEN[g].emoji} ${GRUPPEN[g].label}</option>`).join('')}</select></div>
  </div><div id="quiz-body"></div>`;
  renderQuiz();
}
window.quizChangeLevel = function(){ quizState.level=document.getElementById('quiz-level').value; quizState.qIdx=0;quizState.selected=[];quizState.revealed=false;quizState.score=0; renderQuiz(); };
function renderQuiz(){
  const qs=WISSEN[quizState.level], q=qs[quizState.qIdx];
  const body=document.getElementById('quiz-body'); if(!body)return;
  const prog=`<div style="font-size:12px;color:#888;margin-bottom:10px;font-weight:500">Frage ${quizState.qIdx+1} von ${qs.length} · ✓ ${quizState.score} richtig</div>`;
  const opts=q.opts.map((o,i)=>{
    const sel=quizState.selected.includes(i), isOk=q.correct.includes(i);
    let cls='q-opt', cbCls='q-cb';
    if(quizState.revealed){ if(isOk&&sel){cls+=' rev-ok';cbCls+=' ok';} else if(!isOk&&sel){cls+=' rev-wrong';cbCls+=' wrong';} else if(isOk&&!sel){cls+=' rev-missed';cbCls+=' missed';} }
    else if(sel){cls+=' sel';cbCls+=' sel';}
    return `<div class="${cls}" onclick="quizToggle(${i})"><div class="${cbCls}">${(sel||(quizState.revealed&&isOk))?'✓':''}</div><span>${o}</span></div>`;
  }).join('');
  const actionBtn=quizState.revealed?`<button class="btn btn-primary" onclick="quizNext()" style="margin-top:4px">Nächste Frage →</button>`:`<button class="btn btn-primary" onclick="quizReveal()" style="margin-top:4px">Auswerten</button>`;
  body.innerHTML=prog+`<div class="card-white" style="padding:14px"><div class="q-text">${q.f}</div>${opts}</div>${actionBtn}`;
}
window.quizToggle=function(i){if(quizState.revealed)return;const idx=quizState.selected.indexOf(i);if(idx>-1)quizState.selected.splice(idx,1);else quizState.selected.push(i);renderQuiz();};
window.quizReveal=function(){quizState.revealed=true;const q=WISSEN[quizState.level][quizState.qIdx];if(JSON.stringify([...q.correct].sort())===JSON.stringify([...quizState.selected].sort()))quizState.score++;renderQuiz();};
window.quizNext=function(){const qs=WISSEN[quizState.level];if(quizState.qIdx<qs.length-1){quizState.qIdx++;quizState.selected=[];quizState.revealed=false;renderQuiz();}else{quizFinish();}};
async function quizFinish(){
  const passed=quizState.score>=3;
  const gId=document.getElementById('quiz-grp').value, level=quizState.level;
  const val=level==='bronze'?'bronze':level==='silber'?'silver':'gold';
  const body=document.getElementById('quiz-body');
  body.innerHTML=`<div class="${passed?'result-pass':'result-fail'}">${passed?'✓ Bestanden!':'✗ Nicht bestanden'}<br><span style="font-size:13px;font-weight:400">${quizState.score}/5 richtig · mind. 3 zum Bestehen</span></div>
  ${passed?`<button class="btn btn-green" style="margin-top:10px" onclick="quizSave('${gId}','${val}')">Ergebnis für ${GRUPPEN[gId].emoji} ${GRUPPEN[gId].label} speichern</button>`:''}
  <button class="btn btn-gray" style="margin-top:8px" onclick="quizChangeLevel()">Nochmal / andere Stufe</button>`;
}
window.quizSave = async function(gId,val){
  GRUPPEN[gId].kinder.forEach((_,i)=>{ if(isAnwesend(gId,i)) results[gId+'_'+i+'_Wi']=val; });
  await safeSetDoc(doc(db,'camps',CAMP_ID,'data','results'),{...results,_updated:Date.now()});
  document.getElementById('quiz-body').innerHTML+='<div style="color:#1E5C0A;text-align:center;font-size:13px;margin-top:8px;font-weight:500">✓ In Firebase gespeichert</div>';
};
